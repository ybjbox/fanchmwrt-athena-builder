# features · E 方案预览（YAML）
# 仅用于对比渲染效果，不参与构建。

meta:
  target: qualcommax/ipq60xx
  device: jdcloud_re-cs-02
  source_of_truth: configs/features.conf

# 核心：不可关（关掉就没有雅典娜或没有行为管理）
core:
  - name: athena_target
    enabled: true
    device_extra: false
    packages: []
    source: []
    note: "目标设备由 gen-config.sh 固定输出，此行仅作占位说明"
  - name: athena_led
    enabled: true
    device_extra: true
    packages:
      - luci-app-athena-led
      - luci-i18n-athena-led-zh-cn
    source:
      git:
        - https://github.com/NONGFAH/luci-app-athena-led
    note: "点阵屏小屏驱动"
  - name: athena_custom
    enabled: true
    device_extra: false
    packages:
      - athena-custom
    source:
      feed:
        ybjbox: https://github.com/ybjbox/openwrt-packages.git
    note: "个人默认值：PPPoE / WiFi / LAN IP / 关 IPv6"
  - name: dhcp_comment
    enabled: true
    device_extra: false
    packages:
      - luci-app-dhcp-comment
    source:
      feed:
        ybjbox: ~
    note: "DHCP 客户端备注"
  - name: clash_cleaner
    enabled: true
    device_extra: false
    packages:
      - sysupgrade-clash-cleaner
    source:
      feed:
        ybjbox: ~
    note: "升级后清理 Clash 残留"
  - name: cf_ipcheck
    enabled: true
    device_extra: false
    packages:
      - luci-app-cf-ipcheck
    source:
      feed:
        ybjbox: ~
    note: "Cloudflare 优选 IP 实测"

# 基础工具：按需关
tools:
  - name: tools_base
    enabled: true
    device_extra: false
    packages:
      - tmux
      - htop
      - nano-full
      - fdisk
      - cfdisk
      - sgdisk
      - tune2fs
      - fstrim
      - openssh-sftp-server
      - zoneinfo-asia
      - coremark
      - automount
    source: []
    note: "命令行与磁盘工具"
  - name: zram
    enabled: true
    device_extra: false
    packages:
      - zram-swap
    source: []
    note: "内存压缩（内核选项见 gen-config.sh）"

# 以下默认关闭：每开一个都是独立构建风险点
optional:
  - name: openclash
    enabled: false
    device_extra: false
    packages:
      - luci-app-openclash
    source:
      git:
        - https://github.com/vernesong/OpenClash
    note: "代理"
  - name: lucky
    enabled: false
    device_extra: false
    packages:
      - luci-app-lucky
    source:
      git:
        - https://github.com/gdy666/luci-app-lucky
    note: "内网穿透"
  - name: smartdns
    enabled: false
    device_extra: false
    packages:
      - luci-app-smartdns
      - smartdns
    source:
      git:
        - https://github.com/pymumu/luci-app-smartdns
        - https://github.com/pymumu/openwrt-smartdns
    note: "DNS"
  - name: mosdns
    enabled: false
    device_extra: false
    packages:
      - luci-app-mosdns
    source:
      git:
        - https://github.com/sbwml/luci-app-mosdns
    note: "DNS 分流"
  - name: airconnect
    enabled: false
    device_extra: false
    packages:
      - luci-app-airconnect
      - airconnect
    source:
      git:
        - https://github.com/sbwml/luci-app-airconnect
    note: "AirPlay 桥接"
  - name: wechatpush
    enabled: false
    device_extra: false
    packages:
      - luci-app-wechatpush
    source:
      git:
        - https://github.com/tty228/luci-app-wechatpush
    note: "微信推送"
  - name: bandix
    enabled: false
    device_extra: false
    packages:
      - bandix
      - luci-app-bandix
    source:
      git:
        - https://github.com/timsaya/openwrt-bandix
        - https://github.com/timsaya/luci-app-bandix
    note: "流量看板（与 fwx 统计二选一）"
  - name: quickfile
    enabled: false
    device_extra: false
    packages:
      - luci-app-quickfile
    source:
      git:
        - https://github.com/sbwml/luci-app-quickfile
    note: "网页文件管理器（需 nginx）"
  - name: theme_aurora
    enabled: false
    device_extra: false
    packages:
      - luci-theme-aurora
      - luci-app-aurora-config
    source:
      git:
        - https://github.com/eamonxg/luci-theme-aurora
        - https://github.com/eamonxg/luci-app-aurora-config
    note: "第三方主题"
