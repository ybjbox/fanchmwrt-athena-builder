name: Build FanchmWrt Athena

on:
  schedule:
    # 每周五 03:30 北京时间 = 每周四 19:30 UTC
    # GitHub 的 cron 一律按 UTC 解释，改时间记得换算（北京时间 - 8 小时）。
    # 定时任务实际开跑可能延迟几分钟到几十分钟（GitHub 官方说明，高峰期更明显）。
    - cron: '30 19 * * 4'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'fanchmwrt-snapshot 分支'
        required: false
        default: 'fanchmwrt-26.11'
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  # 定时任务单独成组且不取消任何在跑的构建——否则你手动触发的构建
  # 会被到点的定时任务掐掉。手动构建之间仍互相取消（连续点只跑最新那次）。
  group: athena-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/fanchmwrt/fanchmwrt-snapshot.git
  SOURCE_REF: ${{ inputs.source_ref || 'fanchmwrt-26.11' }}
  # 编译加速：ccache 缓存目录随 actions/cache 持久化，二次构建可复用已编译目标。
  # 注意：OpenWrt 的 rules.mk 会强制 export CCACHE_DIR=$(TOPDIR)/.ccache（即 openwrt/.ccache），
  # 忽略这里的值；这里写成同一路径，只是让 ccache -s 统计能读到真实缓存。
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 5G

jobs:
  # 仅定时触发时运行：上游 commit 没变就跳过整次构建，省掉无意义的 1.5–2.5 小时。
  # 手动触发 / 打 tag 不经过这里（你想编就编）。
  gate:
    name: 上游变更检查（仅定时触发）
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 比对上游 commit 与上次定时构建
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          CUR="$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_REF" | cut -c1-12)"
          [ -n "$CUR" ] || { echo "::error::解析上游 $SOURCE_REF 失败"; exit 1; }
          # 上次定时构建的上游 commit 记在 Release 说明第一行（upstream-commit:）
          LAST="$(gh release list --limit 30 --json tagName,body \
            --jq '[.[] | select(.tagName | startswith("athena-"))][0].body' 2>/dev/null \
            | sed -n 's/^upstream-commit: *\([0-9a-f]\{7,40\}\).*/\1/p' | head -1 || true)"
          echo "当前上游 $SOURCE_REF = $CUR"
          echo "上次定时构建的上游     = ${LAST:-（无记录，按有变化处理）}"
          if [ -n "$LAST" ] && [ "$LAST" = "$CUR" ]; then
            echo "上游无变化，跳过本次构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Athena / ${{ github.event_name }}
    needs: gate
    # gate 在非定时触发时是 skipped，用 always() 保证手动 / tag 构建照常进行
    if: always() && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出构建配置
        uses: actions/checkout@v6

      - name: 解析上游 commit（缓存 key 用）
        id: upstream
        run: |
          SHA="$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_REF" | cut -c1-12)"
          [ -n "$SHA" ] || { echo "::error::解析上游 $SOURCE_REF 失败"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "上游 $SOURCE_REF = $SHA"

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: 安装编译依赖
        run: |
          # Ubuntu 24.04 自带 Python 3.12，官方依赖清单已去掉 python3-distutils
          # （该包在 24.04 不再提供，写上会直接 apt 报错），改用 python3-setuptools
          # ccache：CONFIG_CCACHE=y 需要宿主提供 ccache 命令
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache

      - name: 拉取源码
        run: git clone --depth=1 --branch "$SOURCE_REF" "$SOURCE_REPO" openwrt

      - name: 恢复 ccache（编译缓存）
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          # 必须放在源码 clone 之后：OpenWrt 把缓存写在源码树内的 openwrt/.ccache，
          # 目录不存在时 restore 会自动建好，但 clone 会拒绝非空目录
          path: openwrt/.ccache
          key: ccache-${{ env.SOURCE_REF }}-${{ hashFiles('configs/features.md') }}-v2
          restore-keys: |
            ccache-${{ env.SOURCE_REF }}-

      - name: 恢复工具链缓存（host + 交叉工具链）
        id: tool-restore
        uses: actions/cache/restore@v5
        with:
          # 只缓 host/工具链部分（不含业务包），体积可控；key 带上游 commit，
          # 上游一变自动失效，避免新旧源码混用导致构建异常
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: toolchain-${{ env.SOURCE_REF }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('configs/features.md') }}-v1
          restore-keys: |
            toolchain-${{ env.SOURCE_REF }}-${{ steps.upstream.outputs.sha }}-

      - name: 应用定制（feed + 源码 + 单目录）
        run: bash scripts/diy.sh openwrt

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 Secrets 到默认配置
        env:
          PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
          PPPOE_PASSWORD: ${{ secrets.PPPOE_PASSWORD }}
          WIFI_SSID_2G: ${{ secrets.WIFI_SSID_2G }}
          WIFI_SSID_5G: ${{ secrets.WIFI_SSID_5G }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # 用 Python 做字面替换：密码里出现 & | / 等字符时 sed 会静默出错
          # Secret 名与仓库 Settings 里配置的完全一致（无 MY_ 前缀）；
          # 占位符 __MY_*__ 是模板里的固定字面量，与 Secret 命名无关。
          python3 - <<'PY'
          import os

          path = "files/etc/uci-defaults/99-athena-custom-settings"
          text = open(path, encoding="utf-8").read()
          mapping = {
              "__MY_PPPOE_USERNAME__": os.environ.get("PPPOE_USERNAME", ""),
              "__MY_PPPOE_PASSWORD__": os.environ.get("PPPOE_PASSWORD", ""),
              "__MY_WIFI_SSID_2G__":   os.environ.get("WIFI_SSID_2G", ""),
              "__MY_WIFI_SSID_5G__":   os.environ.get("WIFI_SSID_5G", ""),
              "__MY_WIFI_PASSWORD__":  os.environ.get("WIFI_PASSWORD", ""),
              "__MY_ADMIN_PASSWORD__": os.environ.get("ADMIN_PASSWORD", ""),
          }
          for k, v in mapping.items():
              text = text.replace(k, v)
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          filled = [k for k, v in mapping.items() if v]
          print("已填充占位符:", len(filled), "/", len(mapping))
          if len(filled) < len(mapping):
              missing = [k for k, v in mapping.items() if not v]
              print("::warning:: %d 个占位符未填充: %s（核对 Secrets 名称）"
                    % (len(missing), ", ".join(missing)))
          PY

      - name: 安装首启脚本（写入 base-files overlay）
        run: |
          set -Eeuo pipefail
          # feed 包 athena-custom 自 2026-11 起不再带首启脚本（旧版是 ImmortalWrt 遗留，
          # 会写错 aurora 主题与软件源），这里统一由构建仓提供，直接写进 base-files overlay
          SRC=files/etc/uci-defaults/99-athena-custom-settings
          install -D -m 0755 "$SRC" \
            openwrt/package/base-files/files/etc/uci-defaults/99-athena-custom-settings
          chmod +x "$SRC"
          echo "已写入 base-files overlay"

      - name: 生成 .config（基线 + 功能开关）
        working-directory: openwrt
        run: |
          set -Eeuo pipefail
          {
            echo 'CONFIG_TARGET_MULTI_PROFILE=y'
            echo 'CONFIG_TARGET_qualcommax=y'
            echo 'CONFIG_TARGET_qualcommax_ipq60xx=y'
            echo 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y'
          } > .config
          make defconfig
          bash ../scripts/gen-config.sh --features ../configs/features.md --out .config.fragment
          cat .config.fragment >> .config
          make defconfig
          echo "---- 无线底座 / geodata / device 追加项（编译前取证）----"
          grep -E '^CONFIG_(PACKAGE_(v2ray|ipq-wifi|ath11k|kmod-ath11k)|TARGET_DEVICE_)' .config || true
          # ---- 设备护栏：上次构建曾静默漂移到别的设备，这里当场拦下 ----
          grep -qx 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y' .config \
            || { echo "::error::雅典娜设备符号丢失，defconfig 选中了别的设备"; grep -E '^CONFIG_TARGET_DEVICE_' .config || true; exit 1; }
          if grep -qE '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_8devices' .config; then
            echo "::error::检测到 8devices 设备被选中，目标已漂移"; grep -E '^CONFIG_TARGET_DEVICE_' .config || true; exit 1
          fi
          echo "[设备护栏] 目标 = 雅典娜（jdcloud_re-cs-02），确认无误"

      - name: 校验 required 包（编译前）
        run: bash scripts/check-packages.sh --config openwrt/.config --features configs/features.md

      - name: 生成版本锁
        run: bash scripts/gen-lock.sh --tree openwrt --out versions.lock

      - name: 缓存下载目录
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-${{ env.SOURCE_REF }}-${{ hashFiles('configs/features.md') }}
          restore-keys: |
            dl-${{ env.SOURCE_REF }}-

      - name: 编译（实时显示进度）
        working-directory: openwrt
        run: |
          set -o pipefail
          echo "---- ccache 状态（编译前）----"
          ccache -s || true
          # 第一遍用默认摘要模式：每个包只有一两行输出，实时滚动，
          # 一眼看出「编到哪个软件」，不会像以前 tail 缓冲那样长时间空白。
          # 完整输出同步存 /tmp/build.log 备查。
          make -j"$(nproc)" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "第一遍 make 退出码: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "---- ccache 状态（编译后）----"
            ccache -s || true
            exit 0
          fi
          # 失败自动降级：单线程 V=s 增量重跑，很快到达同一出错点并打印
          # 真实编译错误（默认模式下底层 gcc 报错是被吞掉的）。
          echo "::error::并行编译失败（退出码 $rc），自动降级单线程 V=s 重跑定位真实错误"
          make -j1 V=s 2>&1 | tee /tmp/build-verbose.log
          rc2=${PIPESTATUS[0]}
          echo "第二遍 make 退出码: $rc2"
          echo "---- ccache 状态（编译后）----"
          ccache -s || true
          {
            echo '==== 单线程 V=s 重跑（最后 200 行）===='
            tail -n 200 /tmp/build-verbose.log || true
            echo '==== 并行首跑（最后 100 行）===='
            tail -n 100 /tmp/build.log || true
          } > "$GITHUB_WORKSPACE/build-log-tail.txt"
          exit "$rc2"

      - name: 保存 ccache（编译缓存）
        if: success() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: 保存工具链缓存
        if: success() && steps.tool-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: ${{ steps.tool-restore.outputs.cache-primary-key }}

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ env.SOURCE_REF }}-${{ github.run_number }}
          path: build-log-tail.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          set -Eeuo pipefail
          mkdir -p dist/firmware
          find openwrt/bin/targets -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' -o -name '*.buildinfo' \) \
            -exec cp {} dist/firmware/ \;
          ls -lh dist/firmware

      - name: 产物哈希与 BOM
        run: bash scripts/hash-artifacts.sh --tree openwrt --out dist --lock versions.lock

      - name: 校验 manifest
        run: |
          set -Eeuo pipefail
          # 产物必须是雅典娜的。注意多设备模式（MULTI_PROFILE）下 manifest
          # 是 target 级通用名（不带设备名），设备判断要看镜像文件名。
          IMG="$(find openwrt/bin/targets -type f -name '*jdcloud_re-cs-02*' | head -1)"
          [ -n "$IMG" ] || { echo "::error::产物中没有雅典娜镜像"; find openwrt/bin/targets -type f | head; exit 1; }
          echo "[设备护栏] 雅典娜产物存在：$IMG"
          ls -lh openwrt/bin/targets/qualcommax/ipq60xx/
          M="$(find openwrt/bin/targets -name '*.manifest' -print -quit)"
          [ -n "$M" ] || { echo "找不到 manifest"; exit 1; }
          bash scripts/check-packages.sh --manifest "$M" --features configs/features.md --strict

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: athena-${{ env.SOURCE_REF }}-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -Eeuo pipefail
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) TAG="athena-$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)" ;;
          esac
          # 生成给人看的说明（刷机要点 / 功能清单 / 校验 / 追溯）
          KERNEL="$(ls -d openwrt/build_dir/target-*/linux-qualcommax_ipq60xx/linux-* 2>/dev/null \
            | head -1 | sed 's#.*/linux-##' || true)"
          ROOTFS="$(find openwrt/build_dir -name 'root.squashfs' -print -quit 2>/dev/null || true)"
          MANIFEST="$(find openwrt/bin/targets -name '*.manifest' -print -quit 2>/dev/null || true)"
          bash scripts/gen-release-notes.sh \
            --dist dist \
            --features configs/features.md \
            --manifest "$MANIFEST" \
            --lock versions.lock \
            --upstream "$UPSTREAM_SHA" \
            --upstream-ref "$SOURCE_REF" \
            --trigger "${{ github.event_name }}" \
            --kernel "$KERNEL" \
            --rootfs "$ROOTFS" \
            --out dist/release-notes.md
          # 自动命名的版本（定时/手动）都是正式版，不标 Pre-release；
          # 只有 v* tag 抢 latest，athena-* 一律不抢，避免顶掉你手动发布的正式版
          EXTRA=""
          case "$TAG" in
            v*) ;;
            *)  EXTRA="--latest=false" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            dist/firmware/* dist/SHA256SUMS dist/BOM.txt dist/build-info.json \
            --title "FanchmWrt Athena ${TAG}" \
            --notes-file dist/release-notes.md $EXTRA

      - name: 清理旧的自动版本固件（只留最近 4 个）
        # 定时与手动构建统一对待：所有自动命名（athena-*）的 Release 都算正式版，
        # 按时间倒序保留最近 KEEP 个，更早的连同 tag 一起删除。
        # v* tag 手动发布的正式版不以 athena- 开头，永远不会被这条规则碰到。
        if: success() && (github.event_name == 'schedule' || inputs.create_release || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 4
        run: |
          set -Eeuo pipefail
          echo "自动版本（athena-*）保留最近 ${KEEP} 个，更早的删除："
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("athena-"))]
                  | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' \
          | while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "  - 删除 $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "    删除失败（跳过）: $tag"
            done
          echo "清理完成，当前自动版本数：$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("athena-"))] | length')"
