name: Build FanchmWrt Athena

on:
  schedule:
    # 每周五 03:30 北京时间 = 每周四 19:30 UTC
    # GitHub 的 cron 一律按 UTC 解释，改时间记得换算（北京时间 - 8 小时）。
    # 定时任务实际开跑可能延迟几分钟到几十分钟（GitHub 官方说明，高峰期更明显）。
    - cron: '30 19 * * 4'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'fanchmwrt-snapshot 分支'
        required: false
        default: 'fanchmwrt-26.11'
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  # 定时任务单独成组且不取消任何在跑的构建——否则你手动触发的构建
  # 会被到点的定时任务掐掉。手动构建之间仍互相取消（连续点只跑最新那次）。
  group: athena-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write
  # 末尾「清理过期缓存」要用 REST 删缓存条目
  actions: write

env:
  SOURCE_REPO: https://github.com/fanchmwrt/fanchmwrt-snapshot.git
  SOURCE_REF: ${{ inputs.source_ref || 'fanchmwrt-26.11' }}
  # 编译加速：ccache 缓存目录随 actions/cache 持久化，二次构建可复用已编译目标。
  # 注意：OpenWrt 的 rules.mk 会强制 export CCACHE_DIR=$(TOPDIR)/.ccache（即 openwrt/.ccache），
  # 忽略这里的值；这里写成同一路径，只是让 ccache -s 统计能读到真实缓存。
  # 另外 rules.mk 还会强制 CCACHE_NOCOMPRESS=true，所以缓存是未压缩的，上限要留足余量。
  # 仓库缓存总配额 10GB：dl 约 2.1GB + 工具链约 1.2GB，ccache 留 3GB，合计约 6.3GB。
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 3G

jobs:
  # 仅定时触发时运行：上游 commit 没变就跳过整次构建，省掉无意义的 1.5–2.5 小时。
  # 手动触发 / 打 tag 不经过这里（你想编就编）。
  gate:
    name: 上游变更检查（仅定时触发）
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 比对上游 commit 与上次定时构建
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          CUR="$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_REF" | cut -c1-12)"
          [ -n "$CUR" ] || { echo "::error::解析上游 $SOURCE_REF 失败"; exit 1; }
          # 上次定时构建的上游 commit 记在 Release 说明第一行（upstream-commit:）
          LAST="$(gh release list --limit 30 --json tagName,body \
            --jq '[.[] | select(.tagName | startswith("athena-"))][0].body' 2>/dev/null \
            | sed -n 's/^upstream-commit: *\([0-9a-f]\{7,40\}\).*/\1/p' | head -1 || true)"
          echo "当前上游 $SOURCE_REF = $CUR"
          echo "上次定时构建的上游     = ${LAST:-（无记录，按有变化处理）}"
          if [ -n "$LAST" ] && [ "$LAST" = "$CUR" ]; then
            echo "上游无变化，跳过本次构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出构建配置
        uses: actions/checkout@v6

      - name: 上游补丁冒烟（用今天的上游文件实跑三个补丁）
        # 补的空窗：build 里那次漂移检查只在「真的构建」时跑，上游无变化时
        # 定时门禁会跳过整轮；而这个仓库自己的脚本改动（push 到 main）也不触发
        # 任何工作流。于是一段坏掉的补丁脚本可能几周没人发现。
        #
        # 这里每周用上游真实文件跑一遍三个补丁，几秒完成：只取补丁要动的 4 个
        # 文件（几 KB），不克隆 300MB 源码树。
        # 只报不拦：失败会让本 job 变红并打 error 标注，但 build 的 if 用的是
        # always()，周固件照出。
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          B="https://raw.githubusercontent.com/fanchmwrt/fanchmwrt-snapshot/$SOURCE_REF"
          P="target/linux/qualcommax/ipq60xx/base-files/lib/upgrade/platform.sh"
          E="package/base-files/files/lib/upgrade/emmc.sh"
          H="package/fcm/luci-theme-fanchmwrt/ucode/template/themes/fanchmwrt/header.ut"
          T=drift-tree
          mkdir -p "$T/$(dirname "$P")" "$T/$(dirname "$E")" "$T/include" "$T/$(dirname "$H")"
          curl -fsSL "$B/$P" -o "$T/$P"
          curl -fsSL "$B/$E" -o "$T/$E"
          curl -fsSL "$B/include/target.mk" -o "$T/include/target.mk"
          curl -fsSL "$B/$H" -o "$T/$H"

          bash scripts/prune-defaults.sh "$T"
          bash scripts/patch-upgrade.sh "$T"
          bash scripts/patch-luci-title.sh "$T"

          if ! bash scripts/check-upstream-drift.sh "$T" --github-summary --strict; then
            echo "::error::上游已修复下列补丁，请复核后删除对应调用（详见构建摘要）"
            exit 1
          fi
          echo "[smoke] 三个补丁在今天的上游文件上都跑通了"

  build:
    name: Athena / ${{ github.event_name }}
    needs: gate
    # gate 在非定时触发时是 skipped，用 always() 保证手动 / tag 构建照常进行
    if: always() && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出构建配置
        uses: actions/checkout@v6

      - name: 解析上游 commit（缓存 key 用）
        id: upstream
        run: |
          SHA="$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_REF" | cut -c1-12)"
          [ -n "$SHA" ] || { echo "::error::解析上游 $SOURCE_REF 失败"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "上游 $SOURCE_REF = $SHA"

      - name: 计算配置指纹（缓存 key 用）
        id: cfgfp
        run: |
          # 缓存 key 只跟"真正影响固件的东西"走：生成出来的配置片段 + 生成器本身。
          # 早先用 hashFiles 对 features.md 取哈希，改一行注释也会让 4GB 缓存作废
          # （2026-11-18 就是这么丢掉 ccache/dl/工具链的），这里改成按产物取哈希。
          FP="$({
            bash scripts/gen-config.sh --features configs/features.md
            cat configs/required-packages.txt 2>/dev/null || true
            cat scripts/gen-config.sh
          } | sha256sum | cut -c1-16)"
          echo "hash=$FP" >> "$GITHUB_OUTPUT"
          echo "配置指纹: $FP"

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: 安装编译依赖
        run: |
          # Ubuntu 24.04 自带 Python 3.12，官方依赖清单已去掉 python3-distutils
          # （该包在 24.04 不再提供，写上会直接 apt 报错），改用 python3-setuptools
          # ccache：CONFIG_CCACHE=y 需要宿主提供 ccache 命令
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache

      - name: 拉取源码
        run: git clone --depth=1 --branch "$SOURCE_REF" "$SOURCE_REPO" openwrt

      - name: 恢复 ccache（编译缓存）
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          # 必须放在源码 clone 之后：OpenWrt 把缓存写在源码树内的 openwrt/.ccache，
          # 目录不存在时 restore 会自动建好，但 clone 会拒绝非空目录
          #
          # key 里带 run_number 是故意的：GitHub 的同名缓存不允许覆盖，若 key 固定，
          # 第一次存下后永远是 cache-hit，新编译的对象再也存不进去（缓存只会越来越旧）。
          # 每次换新 key + restore-keys 前缀兜底，等于「接着上一版继续攒」，
          # 旧条目由末尾的「清理过期缓存」步骤删掉，始终只留最新一份。
          path: openwrt/.ccache
          key: ccache-${{ env.SOURCE_REF }}-${{ steps.cfgfp.outputs.hash }}-v3-${{ github.run_number }}
          restore-keys: |
            ccache-${{ env.SOURCE_REF }}-${{ steps.cfgfp.outputs.hash }}-v3-
            ccache-${{ env.SOURCE_REF }}-

      - name: 恢复工具链缓存（host + 交叉工具链）
        id: tool-restore
        uses: actions/cache/restore@v5
        with:
          # 只缓 host/工具链部分（不含业务包），体积可控；key 带上游 commit，
          # 上游一变自动失效，避免新旧源码混用导致构建异常
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: toolchain-${{ env.SOURCE_REF }}-${{ steps.upstream.outputs.sha }}-${{ steps.cfgfp.outputs.hash }}-v2-${{ github.run_number }}
          restore-keys: |
            toolchain-${{ env.SOURCE_REF }}-${{ steps.upstream.outputs.sha }}-

      - name: 应用定制（feed + 源码 + 单目录）
        run: bash scripts/diy.sh openwrt

      - name: 上游漂移检查
        # 补丁（platform_copy_config / 默认包精简 / 主题标题）可能哪天被上游自己
        # 修好，届时补丁会「执行成功但什么也没做」，而你会一直以为它在保护你。
        #
        # 分两种触发：
        #   定时（schedule）→ --strict，有漂移直接失败。周构建是你唯一会看结果的
        #     那次，让它变红才是「主动找你」；失败点在前置阶段，不会白跑 2.5 小时。
        #   手动 / 推送   → 非阻塞，只写摘要。临时想编一版时不该被提醒性质的检查挡住。
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          EXTRA=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then EXTRA="--strict"; fi
          bash scripts/check-upstream-drift.sh openwrt --github-summary $EXTRA || {
            echo "::error::定时构建发现上游漂移：这些补丁已无必要，请复核后删除对应调用（见构建摘要）"
            exit 1
          }

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 回归测试（构建门禁 p0）
        # 必须在「注入 Secrets」之前跑：首启脚本测试自己对占位符做替换，
        # 真实模板被替换过之后就测不出「Secret 没配」这类场景了。
        #
        # 只跑 p0：首启脚本、默认包精简、升级补丁、配置生成器门禁。
        # 生成器契约与解析器用例（--tier all）放在 check-config 里跑，
        # 它们坏了说明工具有问题，不该拦住一次 2.5 小时的构建。
        run: bash tests/run-all.sh --tier p0

      - name: 注入 Secrets 到默认配置
        env:
          PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
          PPPOE_PASSWORD: ${{ secrets.PPPOE_PASSWORD }}
          WIFI_SSID_2G: ${{ secrets.WIFI_SSID_2G }}
          WIFI_SSID_5G: ${{ secrets.WIFI_SSID_5G }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # 用 Python 做字面替换：密码里出现 & | / 等字符时 sed 会静默出错
          # Secret 名与仓库 Settings 里配置的完全一致（无 MY_ 前缀）；
          # 占位符 __MY_*__ 是模板里的固定字面量，与 Secret 命名无关。
          python3 - <<'PY'
          import hashlib, os, sys

          path = "files/etc/uci-defaults/99-athena-custom-settings"
          env = {
              "PPPOE_USERNAME":   os.environ.get("PPPOE_USERNAME", ""),
              "PPPOE_PASSWORD":   os.environ.get("PPPOE_PASSWORD", ""),
              "WIFI_SSID_2G":     os.environ.get("WIFI_SSID_2G", ""),
              "WIFI_SSID_5G":     os.environ.get("WIFI_SSID_5G", ""),
              "WIFI_PASSWORD":    os.environ.get("WIFI_PASSWORD", ""),
              "ADMIN_PASSWORD":   os.environ.get("ADMIN_PASSWORD", ""),
          }
          mapping = {
              "__MY_PPPOE_USERNAME__": env["PPPOE_USERNAME"],
              "__MY_PPPOE_PASSWORD__": env["PPPOE_PASSWORD"],
              "__MY_WIFI_SSID_2G__":   env["WIFI_SSID_2G"],
              "__MY_WIFI_SSID_5G__":   env["WIFI_SSID_5G"],
              "__MY_WIFI_PASSWORD__":  env["WIFI_PASSWORD"],
              "__MY_ADMIN_PASSWORD__": env["ADMIN_PASSWORD"],
          }

          # ---- 红线：SSID 是明文广播的，装错一格等于把密码公开出去 ----
          # 2026-11-17 那版固件就是把密码写进了 5G 的信号名（设备上看得见，
          # 密码本身又是对的），说明是 Secrets 填错位而不是脚本取错变量。
          # 这类错误必须在编译前拦住，不能等刷完机才发现。
          errors = []
          for name in ("WIFI_SSID_2G", "WIFI_SSID_5G"):
              v = env[name]
              if not v:
                  continue
              if env["WIFI_PASSWORD"] and v == env["WIFI_PASSWORD"]:
                  errors.append(
                      "%s 的值与 WIFI_PASSWORD 完全相同 —— 这会把 WiFi 密码当成\n"
                      "    信号名明文广播出去。请到 Settings → Secrets 检查是不是把密码\n"
                      "    粘错了格子（%s 填的应该是无线名称，不是密码）。" % (name, name))
              if len(v.encode()) > 32:
                  errors.append("%s 有 %d 字节，超过 SSID 上限 32 字节" % (name, len(v.encode())))
              if any(c in v for c in "\r\n\t"):
                  errors.append("%s 含换行或制表符（多半是粘贴时带进来的）" % name)

          # 只打印指纹，不打印明文：一眼能看出"哪个 Secret 装的是同一段文本"
          def fp(v):
              return "%2d 字节 / %s" % (len(v), hashlib.sha256(v.encode()).hexdigest()[:8]) if v else "（空）"

          print("---- Secrets 指纹（明文不外泄）----")
          for name in ("WIFI_SSID_2G", "WIFI_SSID_5G", "WIFI_PASSWORD"):
              print("  %-14s %s" % (name, fp(env[name])))
          if env["WIFI_SSID_2G"] and env["WIFI_SSID_2G"] == env["WIFI_SSID_5G"]:
              print("  (注：2G 与 5G 同名)")

          if errors:
              for e in errors:
                  print("::error:: %s" % e.replace("\n", "%0A"))
              sys.exit(1)

          text = open(path, encoding="utf-8").read()
          for k, v in mapping.items():
              text = text.replace(k, v)
          open(path, "w", encoding="utf-8", newline="\n").write(text)

          filled = [k for k, v in mapping.items() if v]
          print("已填充占位符:", len(filled), "/", len(mapping))
          if len(filled) < len(mapping):
              missing = [k for k, v in mapping.items() if not v]
              print("::warning:: %d 个占位符未填充: %s（核对 Secrets 名称）"
                    % (len(missing), ", ".join(missing)))
          PY

      - name: 安装首启脚本（写入 base-files overlay）
        run: |
          set -Eeuo pipefail
          # 首启脚本只由构建仓提供，直接写进 base-files overlay 随固件发布。
          # 不再安装 athena-custom 包：features.md 里已经没有这一行，
          # 那个包自 2026-11 起只剩占位作用，且曾在 2026-11-16 让整轮编译失败。
          SRC=files/etc/uci-defaults/99-athena-custom-settings
          install -D -m 0755 "$SRC" \
            openwrt/package/base-files/files/etc/uci-defaults/99-athena-custom-settings
          chmod +x "$SRC"
          echo "已写入 base-files overlay"

      - name: 生成 .config（基线 + 功能开关）
        working-directory: openwrt
        run: |
          set -Eeuo pipefail
          {
            echo 'CONFIG_TARGET_MULTI_PROFILE=y'
            echo 'CONFIG_TARGET_qualcommax=y'
            echo 'CONFIG_TARGET_qualcommax_ipq60xx=y'
            echo 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y'
          } > .config
          make defconfig
          bash ../scripts/gen-config.sh --features ../configs/features.md --out .config.fragment
          cat .config.fragment >> .config
          make defconfig
          echo "---- 无线底座 / geodata / device 追加项（编译前取证）----"
          grep -E '^CONFIG_(PACKAGE_(v2ray|ipq-wifi|ath11k|kmod-ath11k)|TARGET_DEVICE_)' .config || true
          # ---- 设备护栏：上次构建曾静默漂移到别的设备，这里当场拦下 ----
          grep -qx 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y' .config \
            || { echo "::error::雅典娜设备符号丢失，defconfig 选中了别的设备"; grep -E '^CONFIG_TARGET_DEVICE_' .config || true; exit 1; }
          if grep -qE '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_8devices' .config; then
            echo "::error::检测到 8devices 设备被选中，目标已漂移"; grep -E '^CONFIG_TARGET_DEVICE_' .config || true; exit 1
          fi
          echo "[设备护栏] 目标 = 雅典娜（jdcloud_re-cs-02），确认无误"
          # ---- 加速护栏：CCACHE 的提示受 CONFIG_DEVEL 控制，DEVEL 没开就会
          #      被 defconfig 静默丢弃（编译照常成功，只是全程不走缓存）。
          #      2026-11-17 就是靠这条线索查明「保存出来的 ccache 只有 15KB」。----
          grep -qx 'CONFIG_DEVEL=y' .config \
            || { echo "::error::CONFIG_DEVEL 丢失，ccache 会连带失效"; exit 1; }
          grep -qx 'CONFIG_CCACHE=y' .config \
            || { echo "::error::CONFIG_CCACHE 未生效（该选项的提示由 CONFIG_DEVEL 控制）"; exit 1; }
          echo "[加速护栏] ccache = 已启用（DEVEL + CCACHE 均在 .config 中）"

      - name: 校验 required 包（编译前）
        run: bash scripts/check-packages.sh --config openwrt/.config --features configs/features.md

      - name: 生成版本锁
        run: bash scripts/gen-lock.sh --tree openwrt --out versions.lock

      - name: 缓存下载目录
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-${{ env.SOURCE_REF }}-${{ steps.cfgfp.outputs.hash }}
          restore-keys: |
            dl-${{ env.SOURCE_REF }}-

      - name: 编译（实时显示进度）
        working-directory: openwrt
        run: |
          # GitHub 的 bash 默认带 -e：make 一失败，整个 step 立刻退出，下面的
          # 降级重跑与日志保存全被跳过（2026-11-16 那次失败就是这样，日志里
          # 连"第一遍 make 退出码"都没打印，包级错误也没能留存）。显式关掉。
          set +e
          set -o pipefail
          echo "---- ccache 状态（编译前）----"
          ccache -s || true
          # 第一遍用默认摘要模式：每个包只有一两行输出，实时滚动，
          # 一眼看出「编到哪个软件」，不会像以前 tail 缓冲那样长时间空白。
          # 完整输出同步存 /tmp/build.log 备查。
          make -j"$(nproc)" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "第一遍 make 退出码: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "---- ccache 状态（编译后）----"
            ccache -s || true
            exit 0
          fi
          # 失败自动降级：单线程 V=s 增量重跑，很快到达同一出错点并打印
          # 真实编译错误（默认模式下底层 gcc 报错是被吞掉的）。
          echo "::error::并行编译失败（退出码 $rc），自动降级单线程 V=s 重跑定位真实错误"
          make -j1 V=s 2>&1 | tee /tmp/build-verbose.log
          rc2=${PIPESTATUS[0]}
          echo "第二遍 make 退出码: $rc2"
          echo "---- ccache 状态（编译后）----"
          ccache -s || true
          {
            echo '==== 单线程 V=s 重跑（最后 200 行）===='
            tail -n 200 /tmp/build-verbose.log || true
            echo '==== 并行首跑（最后 100 行）===='
            tail -n 100 /tmp/build.log || true
          } > "$GITHUB_WORKSPACE/build-log-tail.txt"
          exit "$rc2"

      - name: 保存 ccache（编译缓存）
        # key 带 run_number，每次都是新 key，所以不再需要 cache-hit 判断；
        # continue-on-error：缓存是加速手段，存不上不该让整轮构建判失败。
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: 保存工具链缓存
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: ${{ steps.tool-restore.outputs.cache-primary-key }}

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ env.SOURCE_REF }}-${{ github.run_number }}
          # build-log-tail.txt 是编译步骤自己整理的摘要；openwrt/logs 下是
          # OpenWrt 按包分开记的真实错误（失败包的 compile.txt 在这里）。
          path: |
            build-log-tail.txt
            openwrt/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          set -Eeuo pipefail
          mkdir -p dist/firmware
          find openwrt/bin/targets -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' -o -name '*.buildinfo' \) \
            -exec cp {} dist/firmware/ \;
          ls -lh dist/firmware

      - name: 产物哈希与 BOM
        run: bash scripts/hash-artifacts.sh --tree openwrt --out dist --lock versions.lock

      - name: 校验 manifest
        run: |
          set -Eeuo pipefail
          # 产物必须是雅典娜的。注意多设备模式（MULTI_PROFILE）下 manifest
          # 是 target 级通用名（不带设备名），设备判断要看镜像文件名。
          IMG="$(find openwrt/bin/targets -type f -name '*jdcloud_re-cs-02*' | head -1)"
          [ -n "$IMG" ] || { echo "::error::产物中没有雅典娜镜像"; find openwrt/bin/targets -type f | head; exit 1; }
          echo "[设备护栏] 雅典娜产物存在：$IMG"
          ls -lh openwrt/bin/targets/qualcommax/ipq60xx/
          M="$(find openwrt/bin/targets -name '*.manifest' -print -quit)"
          [ -n "$M" ] || { echo "找不到 manifest"; exit 1; }
          bash scripts/check-packages.sh --manifest "$M" --features configs/features.md --strict

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: athena-${{ env.SOURCE_REF }}-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -Eeuo pipefail
          # 标题给人看：自动版本只显示北京时间，不再重复堆 "athena-" 前缀；
          # 真正的唯一标识是 tag（athena-20261116-1542），侧栏点开即可看到
          TAG="${{ github.ref_name }}"
          TITLE="$TAG"
          case "$TAG" in
            v*) ;;
            *)
              TITLE="$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
              TAG="athena-$(date -u -d '+8 hours' '+%Y%m%d-%H%M')"
              ;;
          esac
          # 生成给人看的说明（刷机要点 / 功能清单 / 校验 / 追溯）
          KERNEL="$(ls -d openwrt/build_dir/target-*/linux-qualcommax_ipq60xx/linux-* 2>/dev/null \
            | head -1 | sed 's#.*/linux-##' || true)"
          MANIFEST="$(find openwrt/bin/targets -name '*.manifest' -print -quit 2>/dev/null || true)"
          bash scripts/gen-release-notes.sh \
            --dist dist \
            --features configs/features.md \
            --manifest "$MANIFEST" \
            --lock versions.lock \
            --upstream "$UPSTREAM_SHA" \
            --upstream-ref "$SOURCE_REF" \
            --trigger "${{ github.event_name }}" \
            --kernel "$KERNEL" \
            --out dist/release-notes.md
          # 自动命名的版本（定时/手动）都是正式版，不标 Pre-release；
          # 只有 v* tag 抢 latest，athena-* 一律不抢，避免顶掉你手动发布的正式版
          EXTRA=""
          case "$TAG" in
            v*) ;;
            *)  EXTRA="--latest=false" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            dist/firmware/* dist/SHA256SUMS dist/BOM.txt dist/build-info.json \
            --title "$TITLE" \
            --notes-file dist/release-notes.md $EXTRA

      - name: 清理旧的自动版本固件（只留最近 4 个）
        # 定时与手动构建统一对待：所有自动命名（athena-*）的 Release 都算正式版，
        # 按时间倒序保留最近 KEEP 个，更早的连同 tag 一起删除。
        # v* tag 手动发布的正式版不以 athena- 开头，永远不会被这条规则碰到。
        if: success() && (github.event_name == 'schedule' || inputs.create_release || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 4
        run: |
          set -Eeuo pipefail
          echo "自动版本（athena-*）保留最近 ${KEEP} 个，更早的删除："
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("athena-"))]
                  | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' \
          | while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "  - 删除 $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "    删除失败（跳过）: $tag"
            done
          echo "清理完成，当前自动版本数：$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("athena-"))] | length')"

      - name: 清理过期缓存（每类只留最新一份）
        # ccache / 工具链的 key 都带 run_number，每轮必然新增一条；不清理很快会撞上
        # 仓库 10GB 缓存上限，届时 GitHub 按最久未用淘汰，可能把刚攒好的 ccache 删掉。
        # 这里只保留本轮刚存下的 ccache、工具链，以及 dl 当前 key，其余全部删除。
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_CCACHE: ${{ steps.ccache-restore.outputs.cache-primary-key }}
          KEEP_TOOL: ${{ steps.tool-restore.outputs.cache-primary-key }}
          KEEP_DL: dl-${{ env.SOURCE_REF }}-${{ steps.cfgfp.outputs.hash }}
        run: |
          set -Eeuo pipefail
          echo "保留：$KEEP_CCACHE"
          echo "保留：$KEEP_TOOL"
          echo "保留：$KEEP_DL"
          mapfile -t ROWS < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .key] | @tsv')
          DELETED=0
          for row in "${ROWS[@]}"; do
            [ -n "$row" ] || continue
            id="${row%%$'\t'*}"; key="${row#*$'\t'}"
            case "$key" in
              ccache-*|toolchain-*|dl-*) ;;
              *) continue ;;
            esac
            [ "$key" = "$KEEP_CCACHE" ] && continue
            [ "$key" = "$KEEP_TOOL" ] && continue
            [ "$key" = "$KEEP_DL" ] && continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent; then
              echo "  删除 $key"; DELETED=$((DELETED + 1))
            else
              echo "  删除失败（跳过）$key"
            fi
          done
          echo "共删除 $DELETED 条；当前缓存："
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "  \(.key)  \((.size_in_bytes / 1048576) | floor) MB"'
