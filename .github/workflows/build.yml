name: Build FanchmWrt Athena

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'fanchmwrt-snapshot 分支'
        required: false
        default: 'fanchmwrt-26.11'
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: athena-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/fanchmwrt/fanchmwrt-snapshot.git
  SOURCE_REF: ${{ inputs.source_ref || 'fanchmwrt-26.11' }}

jobs:
  build:
    name: Athena / ${{ github.event_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出构建配置
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: 拉取源码
        run: git clone --depth=1 --branch "$SOURCE_REF" "$SOURCE_REPO" openwrt

      - name: 应用定制（加 feed + clone 自定义包）
        run: bash scripts/diy.sh openwrt

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 Secrets 到默认配置
        env:
          MY_PPPOE_USERNAME: ${{ secrets.MY_PPPOE_USERNAME }}
          MY_PPPOE_PASSWORD: ${{ secrets.MY_PPPOE_PASSWORD }}
          MY_WIFI_SSID_2G: ${{ secrets.MY_WIFI_SSID_2G }}
          MY_WIFI_SSID_5G: ${{ secrets.MY_WIFI_SSID_5G }}
          MY_WIFI_PASSWORD: ${{ secrets.MY_WIFI_PASSWORD }}
          MY_ADMIN_PASSWORD: ${{ secrets.MY_ADMIN_PASSWORD }}
        run: |
          # 用 Python 做字面替换：密码里出现 & | / 等字符时 sed 会静默出错
          python3 - <<'PY'
          import os

          path = "files/etc/uci-defaults/99-athena-custom-settings"
          text = open(path, encoding="utf-8").read()
          mapping = {
              "__MY_PPPOE_USERNAME__": os.environ.get("MY_PPPOE_USERNAME", ""),
              "__MY_PPPOE_PASSWORD__": os.environ.get("MY_PPPOE_PASSWORD", ""),
              "__MY_WIFI_SSID_2G__":   os.environ.get("MY_WIFI_SSID_2G", ""),
              "__MY_WIFI_SSID_5G__":   os.environ.get("MY_WIFI_SSID_5G", ""),
              "__MY_WIFI_PASSWORD__":  os.environ.get("MY_WIFI_PASSWORD", ""),
              "__MY_ADMIN_PASSWORD__": os.environ.get("MY_ADMIN_PASSWORD", ""),
          }
          for k, v in mapping.items():
              text = text.replace(k, v)
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          filled = [k for k, v in mapping.items() if v]
          print("已填充占位符:", len(filled), "/", len(mapping))
          PY

      - name: 覆盖默认配置（避免与 athena-custom 自带脚本重复执行）
        run: |
          set -Eeuo pipefail
          SRC=files/etc/uci-defaults/99-athena-custom-settings
          FEED=openwrt/feeds/ybjbox/athena-custom/files/etc/uci-defaults/99-athena-custom-settings
          if [ -f "$FEED" ]; then
            cp "$SRC" "$FEED"
            echo "已覆盖 feed 内脚本: $FEED"
          else
            install -D -m 0755 "$SRC" \
              openwrt/package/base-files/files/etc/uci-defaults/99-athena-custom-settings
            echo "已写入 base-files overlay"
          fi
          chmod +x "$SRC"

      - name: 生成 .config（基线 + 功能开关）
        working-directory: openwrt
        run: |
          set -Eeuo pipefail
          {
            echo 'CONFIG_TARGET_qualcommax=y'
            echo 'CONFIG_TARGET_qualcommax_ipq60xx=y'
            echo 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y'
          } > .config
          make defconfig
          bash ../scripts/gen-config.sh --features ../configs/features.md --out .config.fragment
          cat .config.fragment >> .config
          make defconfig

      - name: 校验 required 包（编译前）
        run: bash scripts/check-packages.sh --config openwrt/.config

      - name: 生成版本锁
        run: bash scripts/gen-lock.sh --tree openwrt --out versions.lock

      - name: 缓存下载目录
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.SOURCE_REF }}-${{ hashFiles('configs/features.md') }}
          restore-keys: |
            dl-${{ env.SOURCE_REF }}-

      - name: 编译
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tail -n 300

      - name: 收集产物
        run: |
          set -Eeuo pipefail
          mkdir -p dist/firmware
          find openwrt/bin/targets -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' -o -name '*.buildinfo' \) \
            -exec cp {} dist/firmware/ \;
          ls -lh dist/firmware

      - name: 产物哈希与 BOM
        run: bash scripts/hash-artifacts.sh --tree openwrt --out dist --lock versions.lock

      - name: 校验 manifest
        run: |
          set -Eeuo pipefail
          M="$(find openwrt/bin/targets -name '*.manifest' -print -quit)"
          [ -n "$M" ] || { echo "找不到 manifest"; exit 1; }
          bash scripts/check-packages.sh --manifest "$M" --strict

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: athena-${{ env.SOURCE_REF }}-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) TAG="athena-$(date -u +%Y%m%d-%H%M)" ;;
          esac
          gh release create "$TAG" dist/firmware/* dist/SHA256SUMS dist/BOM.txt dist/build-info.json \
            --title "FanchmWrt Athena ${TAG}" \
            --notes-file dist/BOM.txt
